# Put this inside the server{} block for api.devmarvs.com (TLS already enabled).
# This maps https://api.devmarvs.com/bblog/... to your container on 127.0.0.1:18080
# and **strips** the /bblog/ prefix so your Gin routes keep working (they are rooted at "/").

# Optional: if you publish the container to the host on port 18080
location /bblog/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Strip the /bblog/ prefix before forwarding to the app
    rewrite ^/bblog/(.*)$ /$1 break;

    proxy_pass http://127.0.0.1:18080/;
    proxy_read_timeout 120s;
    proxy_redirect off;
}

